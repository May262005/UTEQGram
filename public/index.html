
<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UTEQGram</title>

    <meta name="theme-color" content="#3f51b5">
    <meta name="description" content="Comparte tus momentos con UTEQGram.">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="UTEQGram">

    <meta name="msapplication-TileImage" content="/src/images/icons/app-icon-192x192.png">
    <meta name="msapplication-TileColor" content="#ffffff">

    <link rel="manifest" href="/manifest.json">

    <link rel="apple-touch-icon" href="/src/images/icons/app-icon-192x192.png" sizes="192x192">

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">

    <link rel="stylesheet" href="/src/css/app.css?v=13">
    <link rel="stylesheet" href="/src/css/feed.css?v=13">
</head>

<body>

    <div id="app">

        <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">

            <header class="mdl-layout__header">
                <div class="mdl-layout__header-row">

                    <span class="mdl-layout-title">UTEQGram</span>

                    <div class="mdl-layout-spacer"></div>

                    <nav class="mdl-navigation mdl-layout--large-screen-only">

                        <a class="mdl-navigation__link" href="/">Feed</a>

                        <a class="mdl-navigation__link" href="/help.html">Help</a>

                        <div class="drawer-option">

                            <button class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">
                                Habilitar Notificaciones
                            </button>

                            <button class="install-app-button mdl-button mdl-js-button mdl-button--raised mdl-button--colored" hidden>
                                Instalar aplicación
                            </button>

                        </div>

                    </nav>
                </div>
            </header>

            <div class="mdl-layout__drawer">

                <span class="mdl-layout-title">UTEQGram</span>

                <nav class="mdl-navigation">

                    <a class="mdl-navigation__link" href="/">Feed</a>

                    <a class="mdl-navigation__link" href="/help.html">Help</a>

                    <div class="drawer-option">

                        <button class="enable-notifications mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent">
                            Habilitar Notificaciones
                        </button>

                        <button class="install-app-button mdl-button mdl-js-button mdl-button--raised mdl-button--colored" hidden>
                            Instalar aplicación
                        </button>

                    </div>

                </nav>
            </div>

            <main class="mdl-layout__content mat-typography">

                <div id="create-post">

                    <form id="create-post-form">

                        <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label">

                            <input class="mdl-textfield__input" type="text" id="title" name="title">

                            <label class="mdl-textfield__label" for="title">
                                Title
                            </label>

                        </div>

                        <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label" id="manual-location">

                            <input class="mdl-textfield__input" type="text" id="location" name="location">

                            <label class="mdl-textfield__label" for="location">
                                Location
                            </label>

                        </div>

                        <br>

                        <div>

                            <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent" type="submit" id="post-btn">
                                Postear!
                            </button>

                        </div>

                        <br>

                        <div>

                            <button class="mdl-button mdl-js-button mdl-button--fab" id="close-create-post-modal-btn" type="button">
                                <i class="material-icons">close</i>
                            </button>

                        </div>

                    </form>

                </div>

                <img src="/src/images/main-image-lg.jpg" alt="Explore the City" class="main-image">

                <div class="page-content">

                    <h5 class="text-center mdl-color-text--primary">
                        Comparte tus Momentos
                    </h5>

                    <div id="shared-moments"></div>

                </div>

                <div class="floating-button">

                    <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored" id="share-image-button">
                        <i class="material-icons">add</i>
                    </button>

                </div>

                <div id="confirmation-toast" aria-live="assertive" aria-atomic="true" aria-relevant="text" class="mdl-snackbar mdl-js-snackbar">

                    <div class="mdl-snackbar__text"></div>

                    <button type="button" class="mdl-snackbar__action"></button>

                </div>

            </main>

        </div>

    </div>

    <div id="snackbar" class="custom-snackbar"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/src/js/idb.js"></script>

    <script src="/src/js/feed.js?v=10"></script>

    <script src="/src/js/app.js?v=10"></script>

</body>

</html>
